<style>
@font-face{font-family:'Cascadia Code';font-style:normal;font-weight:200 700;font-display:block;src:url(assets/fonts/cascadia-code-latin.woff2) format('woff2')}
html,body{margin:0;background:#E8EDF1;color:#0E1317}
body{font-family:'Cascadia Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
::selection{background:#0E1317;color:#E8EDF1}
.site{display:block;position:relative;container-type:inline-size}
.site img{display:block;width:100%;height:auto}
/* the header logo, live over the screenshot, where archgenlabs.com puts it */
.brand{position:absolute;left:6.3889cqw;top:3.8889cqw;width:12.797cqw;height:1.9444cqw}
.brand .patch{position:absolute;inset:-3px;background:#E8EDF1}
.brand .lockup{position:absolute;inset:0;background:url(assets/wordmark.webp) 0 0/100% 100% no-repeat}
@media (max-width:600px){.brand{left:4.1026cqw;top:14.359cqw;width:47.251cqw;height:7.1795cqw}}
.replay{position:fixed;left:16px;bottom:16px;z-index:10;height:44px;padding:0 20px;border:0;border-radius:999px;background:#0E1317;color:#E8EDF1;font:500 14px/1 'Cascadia Code',ui-monospace,monospace;font-feature-settings:"calt" 0;cursor:pointer;transition:transform 100ms ease-out,background-color 150ms ease-out}
.replay:hover{background:#435565}
.replay:active{transform:scale(.97)}
.replay:focus-visible{outline:2px solid #D65148;outline-offset:3px}
.replay[hidden]{display:none}
/* Archgen loaders: brand tokens from Brand Identity · Volume 01 */
.agl {
  --agl-ice: #E8EDF1; --agl-ink: #0E1317; --agl-surface: #F7FAFB; --agl-slate: #435565;
  --agl-flare: #D65148; --agl-steel: #738A9A; --agl-icefill: #CCDBE2; --agl-die: #161E24;
  position: fixed; inset: 0; z-index: 2147483000;
  display: grid; place-items: center;
  overflow: hidden;
  background: var(--agl-ground); color: var(--agl-fg);
  font-family: "Cascadia Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; /* taste-skill-ignore: the brand's only typeface, Brand Identity Book 07 */
  font-variant-numeric: tabular-nums; font-feature-settings: "calt" 0;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
  cursor: default;
  will-change: transform, opacity, clip-path;
}
.agl[data-host="box"] { position: absolute; }
.agl--ice { --agl-ground: #E8EDF1; --agl-fg: #0E1317; }
.agl--ink { --agl-ground: #0E1317; --agl-fg: #E8EDF1; }
.agl svg { display: block; overflow: visible; }
.agl-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
html.agl-lock, html.agl-lock body { overflow: hidden; }

/* Route: the ground is its own layer, so it can clear while the mark flies to the header */
.agl[data-kind="route"] { background: transparent; }
.agl-bg { position: absolute; inset: 0; background: var(--agl-ground); }
.agl-route { position: relative; }
.agl-route svg { width: min(62vw, 420px); height: auto; }
.agl[data-host="box"] .agl-route svg { width: min(42cqw, 380px); }

/* Place */
.agl-place { display: grid; justify-items: center; gap: clamp(14px, 2.4vmin, 22px); }
.agl-place svg { width: min(72vw, 54vh, 420px); height: auto; transform-origin: 39.4% 71.2%; }
.agl[data-host="box"] .agl-place svg { width: min(40cqw, 54cqh, 420px); }
.agl-place p { margin: 0; font-size: 13px; line-height: 1.3; color: var(--agl-slate); letter-spacing: 0.01em; }
.agl-place p b { font-weight: 600; color: var(--agl-ink); }
.agl-place text { font-family: inherit; font-size: 9px; letter-spacing: 0.02em; }

/* Stack (Hairline) */
.agl-stack [data-hairline] {
  width: min(84vw, 66vh, 560px);
  pointer-events: none;
  --hairline-plate: #E8EDF1; --hairline-edge: #435565; --hairline-mid: #738A9A;
  --hairline-lo: #CCDBE2; --hairline-hi: #D65148; --hairline-stroke: 1.25;
}
.agl[data-host="box"] .agl-stack [data-hairline] { width: min(56cqw, 78cqh, 560px); }

/* Close */
.agl-close { display: grid; justify-items: start; gap: clamp(6px, 1.4vmin, 14px); padding: 0 16px; }
.agl-close .num { display: flex; align-items: baseline; gap: 0.12em; font-weight: 600; letter-spacing: -0.04em; line-height: 0.95; font-size: clamp(60px, 15vw, 196px); color: var(--agl-flare); }
.agl[data-host="box"] .agl-close .num { font-size: clamp(40px, 13cqw, 196px); }
.agl-close .num .u { font-size: 0.24em; font-weight: 400; letter-spacing: 0; color: var(--agl-steel); }
.agl-close .line { display: grid; font-size: clamp(18px, 2.4vw, 30px); line-height: 1.2; letter-spacing: -0.01em; font-weight: 500; }
.agl[data-host="box"] .agl-close .line { font-size: clamp(14px, 2.2cqw, 30px); }
.agl-close .line > span { grid-area: 1 / 1; white-space: nowrap; }
.agl-close .line .a { color: var(--agl-steel); }
.agl-close .line .b { color: var(--agl-ice); opacity: 0; }
.agl-close .pin { display: inline-block; width: 0.26em; height: 0.26em; margin-left: 0.06em; border-radius: 50%; background: var(--agl-flare); }

/* Expose */
.agl-expose { display: grid; justify-items: center; gap: clamp(12px, 2.2vmin, 20px); }
.agl-expose svg { width: min(84vw, 62vh, 480px); height: auto; }
.agl[data-host="box"] .agl-expose svg { width: min(50cqw, 68cqh, 480px); }
.agl-expose p { margin: 0; font-size: 13px; line-height: 1.3; color: var(--agl-steel); }
.agl-expose p b { font-weight: 600; color: var(--agl-ice); }

@media (prefers-reduced-motion: reduce) { .agl { will-change: auto; } }

 *
 * Every figure is drawn in a 400 × 320 viewBox. World space is x/y on the
 * ground and z up. Plates are filled with the ground colour and painted back
 * to front, so a nearer one covers a farther one: append in that order. At
 * the default camera, Cam(45, 0.5, S), +x runs down to the right and +y down
 * to the left, so the corner with the largest x and y is nearest the viewer:

 * Camera

 *                                          it only centres, it never scales: choose S by trying values, with the most extreme pose in points.
